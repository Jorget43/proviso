name: Build and push Docker image

on:
  push:
    # Every branch is built and smoke-tested; only master and release tags
    # publish an image (see build-and-push).
    branches:
      - '**'
    tags:
      - 'v*'
  # Dependabot (and any other) pull requests: run the checks, never publish.
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorget43/proviso

jobs:
  # Privacy gate — this repo is public. Scans every commit for database /
  # statement / secret files, real email addresses, phone numbers, private
  # network addresses and non-noreply commit identities. (The personal-data
  # denylist is private and only runs in the local git hooks.)
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Privacy scan (all commits)
        run: node scripts/privacy-scan.mjs --all --ci

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The phone app's packages (apps/client) are mostly Expo's build and
      # dev-server tools, which run on a developer's machine, not on a NAS or
      # inside the app. Several of their advisories have no fixed version yet,
      # so only a critical one fails here. What the NAS image ships is audited
      # strictly at the end of this job.
      - name: Audit the app's dependencies (critical only)
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck all workspaces
        run: npm run typecheck

      # The local-first schema (packages/core/src/schema.ts) must always have
      # its migration committed: regenerating must produce nothing new.
      - name: Check Drizzle migrations match the schema
        run: |
          npm run db:generate -w @proviso/core
          git status --porcelain packages/core/drizzle packages/core/src/migrations.ts
          test -z "$(git status --porcelain packages/core/drizzle packages/core/src/migrations.ts)"

      - name: Run tests (every workspace)
        run: npm test

      # Last, because it removes the dev tools the steps above need. Prunes
      # exactly as the Dockerfile's pruner stage does (dropping the app's
      # workspaces), which also proves the prune resolves, then fails on a
      # high/critical advisory in what remains: what the image ships.
      - name: Prune as the image does, and audit what it ships
        run: |
          rm -rf apps/client packages/tokens
          npm pkg set --json workspaces='["apps/web","packages/core"]'
          npm prune --omit=dev
          npm audit --omit=dev --audit-level=high

  # Builds the image and runs it the way a NAS does: a fresh volume (migrate +
  # seed), then a restart (backup + migrate an existing database). Nothing is
  # published unless this passes.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: proviso:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start, restart, and check it answers
        run: |
          wait_up() {
            for i in $(seq 1 60); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
              [ "$code" = "200" ] && return 0
              sleep 2
            done
            echo "App did not answer"; docker logs smoke; return 1
          }
          docker run -d --name smoke -p 3000:3000 -v smoke-data:/data proviso:smoke
          wait_up
          docker logs smoke | grep -q "Database seeded" || { echo "Seed did not run"; docker logs smoke; exit 1; }
          curl -fsS http://localhost:3000/api/version
          docker restart smoke
          wait_up
          docker logs smoke | grep -q "Database exists" || { echo "Restart path not taken"; docker logs smoke; exit 1; }
          if docker logs smoke 2>&1 | grep -q "migrate deploy FAILED"; then docker logs smoke; exit 1; fi
          echo "Smoke test passed"

  build-and-push:
    needs: [privacy, test, smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, needed for `git describe` below

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: meta
        # `tag` names the docker image tag pushed for this run (branch name or
        # release tag, unchanged). `version` is what gets baked into
        # PROVISO_VERSION and must never be a bare branch name — on a tag push
        # it's the tag itself; on a master push it's `git describe`, which
        # resolves to the release tag when master and the tag point at the
        # same commit, and to `<tag>-<n>-g<sha>` (or a bare short sha with no
        # tags yet) for untagged commits ahead of the last release.
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          build-args: |
            PROVISO_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
