name: Build and push Docker image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  # Dependabot (and any other) pull requests: run the checks, never publish.
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorget43/proviso

jobs:
  # Privacy gate — this repo is public. Scans every commit for database /
  # statement / secret files, real email addresses, phone numbers, private
  # network addresses and non-noreply commit identities. (The personal-data
  # denylist is private and only runs in the local git hooks.)
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Privacy scan (all commits)
        run: node scripts/privacy-scan.mjs --all --ci

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on a high/critical advisory in anything that ships in the image.
      # Dev-only tooling (eslint, vitest) is excluded: it never reaches
      # production, and its advisories often have no non-breaking fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run engine tests
        run: npm test

  build-and-push:
    needs: [privacy, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for `git describe` below

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: meta
        # `tag` names the docker image tag pushed for this run (branch name or
        # release tag, unchanged). `version` is what gets baked into
        # PROVISO_VERSION and must never be a bare branch name — on a tag push
        # it's the tag itself; on a master push it's `git describe`, which
        # resolves to the release tag when master and the tag point at the
        # same commit, and to `<tag>-<n>-g<sha>` (or a bare short sha with no
        # tags yet) for untagged commits ahead of the last release.
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PROVISO_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
