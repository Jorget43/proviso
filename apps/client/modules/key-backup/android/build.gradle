plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.proviso'
version = '0.1.0'

android {
  namespace "app.proviso.keybackup"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.credentials:credentials:1.6.0"
  // Google Password Manager on Android 13 and earlier, through Play services.
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
}
